name: Daily Paper Scout

on:
  schedule:
    - cron: "17 1 * * *" # UTC 01:17，约北京时间 09:17
  workflow_dispatch:
    inputs:
      command:
        description: 运行模式（定时运行时固定为 all）
        type: choice
        default: all
        options:
          - all      # 先处理 ✅ 确认，再抓取新论文
          - confirm  # 仅轮询 ✅ 并收录到 paperlist
          - scout    # 仅抓取 + 打分 + 推送 Slack 候选

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（含 paperlist submodule）
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAPERLIST_PAT }}
          submodules: recursive

      - name: 修正 submodule 状态并配置推送 remote
        run: |
          git -C paperlist checkout main 2>/dev/null || git -C paperlist checkout -B main origin/main
          git -C paperlist remote set-url origin "https://x-access-token:${{ secrets.PAPERLIST_PAT }}@github.com/Riecacc/Awesome-Physical-AI-Infra-Papers.git"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 运行论文巡检
        id: scout
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_API_URL: ${{ secrets.KIMI_API_URL }}
          KIMI_MODEL: ${{ secrets.KIMI_MODEL }}
          SCORE_THRESHOLD: ${{ secrets.SCORE_THRESHOLD }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python src/main.py ${{ github.event.inputs.command || 'all' }}

      # 先推 paperlist，再让主仓库记录新的 submodule 指针，
      # 避免出现主仓库指向远端尚不存在的 commit 的时间窗
      - name: 推送 paperlist
        run: |
          cd paperlist
          git add README.md
          git diff --cached --quiet || (git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "Add confirmed papers" && git push origin main)

      - name: 提交 state/ 与 submodule 指针
        run: |
          git add state/ paperlist
          git diff --cached --quiet || (git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "chore: update scout state and paperlist pointer [skip ci]" && git push)
